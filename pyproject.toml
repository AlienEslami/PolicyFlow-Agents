[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "policyflow-agents"
version = "0.1.0"
description = "Governed multi-agent workflow demonstrator for synthetic insurance servicing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1,<2",
  "mcp>=2.1,<3",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
policyflow = "policyflow.cli:main"

[project.optional-dependencies]
aws = [
  "boto3>=1.40,<2",
  "botocore[crt]>=1.43,<2",
]
models = [
  "sentencepiece>=0.2,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<6",
]
postgres = [
  "alembic>=1.16,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2,<3",
]
dev = [
  "cfn-lint>=1.39,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policyflow = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["policyflow"]

[[tool.mypy.overrides]]
module = ["boto3", "fastembed", "transformers"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["policyflow"]
omit = [
  "src/policyflow/cli.py",
  "src/policyflow/postgres.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
