apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: policyflow-key-vault
  namespace: policyflow
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID
    keyvaultName: REPLACE_WITH_KEY_VAULT_NAME
    tenantId: REPLACE_WITH_ENTRA_TENANT_ID
    objects: |
      array:
        - |
          objectName: policyflow-postgres-url
          objectType: secret
          objectVersion: ""
        - |
          objectName: policyflow-model-endpoint
          objectType: secret
          objectVersion: ""

