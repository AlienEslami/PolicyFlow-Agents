apiVersion: v1
kind: Namespace
metadata:
  name: policyflow
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policyflow-api
  namespace: policyflow
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyflow-api
  namespace: policyflow
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: policyflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policyflow-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: policyflow-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REPLACE_WITH_ACR/policyflow-agents:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POLICYFLOW_PROFILE
              value: azure
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: policyflow-key-vault
---
apiVersion: v1
kind: Service
metadata:
  name: policyflow-api
  namespace: policyflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: policyflow-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: policyflow-api
  namespace: policyflow
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: policyflow-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policyflow-api
  namespace: policyflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policyflow-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policyflow-default-deny
  namespace: policyflow
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

