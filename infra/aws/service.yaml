AWSTemplateFormatVersion: "2010-09-09"
Description: PolicyFlow ECS Fargate service, HTTPS edge, observability, IAM, and CI role.

Parameters:
  ProjectName:
    Type: String
    Default: policyflow-agents
    AllowedPattern: "[a-z0-9-]+"
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
  ImageUri:
    Type: String
    Description: Immutable ECR image URI, including a unique tag.
  EcrRepositoryName:
    Type: String
  EcrRepositoryArn:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random header shared by CloudFront and the ALB listener rule.
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing provider ARN; leave empty to create it in this stack.
  GitHubSubject:
    Type: String
    Description: Exact immutable GitHub OIDC sub for the production branch.
  EnableBedrock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  BedrockInferenceProfileId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0

Conditions:
  CreateGitHubProvider: !Equals [!Ref GitHubOidcProviderArn, ""]
  BedrockEnabled: !Equals [!Ref EnableBedrock, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}"
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public"

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-b"

  SubnetRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin traffic to the PolicyFlow ALB.
      VpcId: !Ref Vpc
      SecurityGroupEgress: []
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PolicyFlow Fargate tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS APIs for ECR, Logs, Secrets Manager, STS, and optional Bedrock.
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  LoadBalancerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Requests are additionally authenticated by a secret origin header.

  LoadBalancerEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvironmentName}-ingestion-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvironmentName}-ingestion"
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  IngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IngestionQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AcceptOnlyThisBucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestionQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:s3:::${ProjectName}-${EnvironmentName}-ingestion-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  IngestionBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestionQueuePolicy
    Properties:
      BucketName: !Sub >-
        ${ProjectName}-${EnvironmentName}-ingestion-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSyntheticPipelineArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestionQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
                  - Name: suffix
                    Value: .json
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: synthetic-only

  IngestionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NormalizeOnlyPolicyFlowDocuments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeOnlyIngestionQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt IngestionQueue.Arn
              - Sid: ReadOnlyIncomingObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${IngestionBucket.Arn}/incoming/*"
              - Sid: WriteOnlyProcessedManifests
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${IngestionBucket.Arn}/processed/*"
              - Sid: WriteOnlyIngestionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${IngestionLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  IngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-ingestion"
      Description: Normalize bounded synthetic JSON documents into chunk manifests.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt IngestionLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          OUTPUT_PREFIX: processed/
          MAX_OBJECT_BYTES: "1048576"
      Code:
        ZipFile: |
          import hashlib
          import json
          import os
          from urllib.parse import unquote_plus
          import boto3

          s3 = boto3.client("s3")
          OUTPUT_PREFIX = os.environ["OUTPUT_PREFIX"]
          MAX_OBJECT_BYTES = int(os.environ["MAX_OBJECT_BYTES"])
          INJECTION_MARKERS = ("ignore previous", "system prompt", "reveal secret")

          def chunk_text(text, size=800, overlap=100):
              chunks = []
              start = 0
              while start < len(text):
                  chunks.append(text[start:start + size])
                  if start + size >= len(text):
                      break
                  start += size - overlap
              return chunks

          def process_record(record):
              envelope = json.loads(record["body"])
              detail = envelope["Records"][0]["s3"]
              bucket = detail["bucket"]["name"]
              key = unquote_plus(detail["object"]["key"])
              if not key.startswith("incoming/") or not key.endswith(".json"):
                  return
              size = int(detail["object"].get("size", 0))
              if size > MAX_OBJECT_BYTES:
                  raise ValueError("object_too_large")
              source = s3.get_object(Bucket=bucket, Key=key)
              raw = source["Body"].read(MAX_OBJECT_BYTES + 1)
              if len(raw) > MAX_OBJECT_BYTES:
                  raise ValueError("object_too_large")
              payload = json.loads(raw)
              documents = payload if isinstance(payload, list) else payload["documents"]
              if not isinstance(documents, list) or len(documents) > 50:
                  raise ValueError("invalid_document_batch")
              chunks = []
              for document in documents:
                  document_id = str(document["document_id"])
                  tenant_id = str(document["tenant_id"])
                  title = str(document["title"])
                  text = str(document["text"])
                  if not document_id or not tenant_id or not title or not text:
                      raise ValueError("missing_document_field")
                  quarantined = any(marker in text.casefold() for marker in INJECTION_MARKERS)
                  for position, content in enumerate(chunk_text(text)):
                      digest = hashlib.sha256(
                          f"{tenant_id}:{document_id}:{position}:{content}".encode()
                      ).hexdigest()[:16]
                      chunks.append({
                          "chunk_id": f"ING-{digest}",
                          "document_id": document_id,
                          "tenant_id": tenant_id,
                          "title": title,
                          "position": position,
                          "text": content,
                          "quarantined": quarantined,
                      })
              output_key = OUTPUT_PREFIX + key.removeprefix("incoming/").removesuffix(".json") + ".manifest.json"
              body = json.dumps({"source_key": key, "chunks": chunks}, separators=(",", ":"))
              s3.put_object(
                  Bucket=bucket,
                  Key=output_key,
                  Body=body.encode(),
                  ContentType="application/json",
                  ServerSideEncryption="AES256",
              )
              print(json.dumps({
                  "event": "ingestion_completed",
                  "source_key": key,
                  "documents": len(documents),
                  "chunks": len(chunks),
                  "quarantined": sum(1 for item in chunks if item["quarantined"]),
              }))

          def handler(event, _context):
              failures = []
              for record in event.get("Records", []):
                  try:
                      process_record(record)
                  except Exception as error:
                      print(json.dumps({
                          "event": "ingestion_failed",
                          "message_id": record.get("messageId"),
                          "error_type": type(error).__name__,
                      }))
                      failures.append({"itemIdentifier": record.get("messageId", "unknown")})
              return {"batchItemFailures": failures}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvironmentName}-ingestion"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  IngestionEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt IngestionQueue.Arn
      FunctionName: !Ref IngestionFunction
      Enabled: true
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2

  IngestionDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow ingestion has a poison message in its dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow ingestion Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${EnvironmentName}/runtime"
      Description: PolicyFlow production bearer token; never stored in source or task JSON.
      GenerateSecretString:
        SecretStringTemplate: '{"purpose":"policyflow-api-auth"}'
        GenerateStringKey: auth_token
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PolicyFlowTaskBootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullOnlyThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Ref EcrRepositoryArn
              - Sid: WriteOnlyThisLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"
              - Sid: ReadOnlyThisRuntimeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecret
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies: !If
        - BedrockEnabled
        - - PolicyName: InvokeOnlyPolicyFlowBedrockModel
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource:
                    - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockInferenceProfileId}"
                    - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: policyflow-api
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          LinuxParameters:
            InitProcessEnabled: true
          PortMappings:
            - Name: http
              ContainerPort: 8000
              Protocol: tcp
              AppProtocol: http
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: POLICYFLOW_EMF_ENABLED
              Value: "true"
            - Name: POLICYFLOW_MODEL_BACKEND
              Value: !If [BedrockEnabled, bedrock, deterministic]
            - Name: POLICYFLOW_MCP_ALLOWED_HOSTS
              Value: !GetAtt LoadBalancer.DNSName
            - !If
              - BedrockEnabled
              - Name: POLICYFLOW_BEDROCK_MODEL_ID
                Value: !Ref BedrockInferenceProfileId
              - !Ref AWS::NoValue
          Secrets:
            - Name: POLICYFLOW_AUTH_TOKEN
              ValueFrom: !Sub "${RuntimeSecret}:auth_token::"
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c "import urllib.request;
                urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
                || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
              mode: non-blocking
              max-buffer-size: 4m
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health/ready
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: application/json
            MessageBody: '{"detail":"origin authentication required"}'

  OriginHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-PolicyFlow-Origin
            Values: [!Ref OriginVerifySecret]
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: OriginHeaderRule
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: policyflow-api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-disabled"
        Comment: API traffic is never cached.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-api"
        Comment: Forward API inputs while CloudFront supplies the ALB origin header.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Accept
            - Content-Type
            - Mcp-Method
            - Mcp-Name
            - Mcp-Protocol-Version
            - X-PolicyFlow-Authorization
            - X-Correlation-ID
            - X-Subject
            - X-Role
            - X-Tenant-ID
        QueryStringsConfig:
          QueryStringBehavior: all

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-security"
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  AuthorizationHeaderFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-authorization"
      AutoPublish: true
      FunctionConfig:
        Comment: Safely map the viewer bearer token to an origin-forwarded header.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var viewerAuthorization = request.headers.authorization;
          delete request.headers['x-policyflow-authorization'];
          if (viewerAuthorization) {
            request.headers['x-policyflow-authorization'] = {
              value: viewerAuthorization.value
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${EnvironmentName} HTTPS edge"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: policyflow-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-PolicyFlow-Origin
                HeaderValue: !Ref OriginVerifySecret
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: policyflow-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref CachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AuthorizationHeaderFunction.FunctionARN
          Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApplicationErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterName: !Sub "${ProjectName}-${EnvironmentName}-errors"
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: PolicyFlow
          MetricName: ApplicationErrors
          MetricValue: "1"
          DefaultValue: 0

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow ECS service CPU is high for ten minutes.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !Sub "${ProjectName}-${EnvironmentName}"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TargetFiveXxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow targets returned five or more 5xx responses in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow has an unhealthy registered target.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${EnvironmentName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "ECS CPU and memory",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", "ClusterName", "${Cluster}", "ServiceName", "${ProjectName}-${EnvironmentName}"],
                  [".", "MemoryUtilization", ".", ".", ".", "."]
                ],
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "ALB requests, latency, and errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", {"stat": "Sum"}],
                  [".", "TargetResponseTime", ".", ".", {"stat": "p95"}],
                  [".", "HTTPCode_Target_5XX_Count", ".", ".", {"stat": "Sum"}]
                ],
                "period": 300
              }
            },
            {
              "type": "log",
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Recent application requests",
                "region": "${AWS::Region}",
                "query": "SOURCE '${LogGroup}' | fields @timestamp, level, method, route, status_code, duration_ms, correlation_id | sort @timestamp desc | limit 50"
              }
            },
            {
              "type": "metric",
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Event-driven ingestion health",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${IngestionFunction}", {"stat": "Sum"}],
                  [".", "Errors", ".", ".", {"stat": "Sum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${IngestionQueue.QueueName}", {"stat": "Maximum"}],
                  [".", ".", ".", "${IngestionDeadLetterQueue.QueueName}", {"stat": "Maximum"}]
                ],
                "period": 300
              }
            }
          ]
        }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Exact-repository OIDC role for PolicyFlow image and ECS deployments.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubProvider
                - !Ref GitHubOidcProvider
                - !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: DeployOnlyPolicyFlow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyPolicyFlowImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Ref EcrRepositoryArn
              - Sid: RegisterAndReadTaskDefinition
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: DeployOnlyPolicyFlowService
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-${EnvironmentName}/${ProjectName}-${EnvironmentName}"
              - Sid: PassOnlyPolicyFlowTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  HttpsUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  CloudFrontDistributionId:
    Value: !Ref Distribution
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !Sub "${ProjectName}-${EnvironmentName}"
  TaskDefinitionFamily:
    Value: !Sub "${ProjectName}-${EnvironmentName}"
  RuntimeSecretArn:
    Value: !Ref RuntimeSecret
  LogGroupName:
    Value: !Ref LogGroup
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ProjectName}-${EnvironmentName}"
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  EcrRepositoryName:
    Value: !Ref EcrRepositoryName
  IngestionBucketName:
    Value: !Ref IngestionBucket
  IngestionQueueUrl:
    Value: !Ref IngestionQueue
  IngestionDeadLetterQueueUrl:
    Value: !Ref IngestionDeadLetterQueue
