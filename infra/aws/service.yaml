AWSTemplateFormatVersion: "2010-09-09"
Description: PolicyFlow ECS Fargate service, HTTPS edge, observability, IAM, and CI role.

Parameters:
  ProjectName:
    Type: String
    Default: policyflow-agents
    AllowedPattern: "[a-z0-9-]+"
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
  ImageUri:
    Type: String
    Description: Immutable ECR image URI, including a unique tag.
  EcrRepositoryName:
    Type: String
  EcrRepositoryArn:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random header shared by CloudFront and the ALB listener rule.
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing provider ARN; leave empty to create it in this stack.
  GitHubSubject:
    Type: String
    Description: Exact immutable GitHub OIDC sub for the production branch.
  EnableBedrock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  BedrockInferenceProfileId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0

Conditions:
  CreateGitHubProvider: !Equals [!Ref GitHubOidcProviderArn, ""]
  BedrockEnabled: !Equals [!Ref EnableBedrock, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}"
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public"

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-b"

  SubnetRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin traffic to the PolicyFlow ALB.
      VpcId: !Ref Vpc
      SecurityGroupEgress: []
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PolicyFlow Fargate tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS APIs for ECR, Logs, Secrets Manager, STS, and optional Bedrock.
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  LoadBalancerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Requests are additionally authenticated by a secret origin header.

  LoadBalancerEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${EnvironmentName}/runtime"
      Description: PolicyFlow production bearer token; never stored in source or task JSON.
      GenerateSecretString:
        SecretStringTemplate: '{"purpose":"policyflow-api-auth"}'
        GenerateStringKey: auth_token
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PolicyFlowTaskBootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullOnlyThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Ref EcrRepositoryArn
              - Sid: WriteOnlyThisLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"
              - Sid: ReadOnlyThisRuntimeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecret
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies: !If
        - BedrockEnabled
        - - PolicyName: InvokeOnlyPolicyFlowBedrockModel
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource:
                    - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockInferenceProfileId}"
                    - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: policyflow-api
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          LinuxParameters:
            InitProcessEnabled: true
          PortMappings:
            - Name: http
              ContainerPort: 8000
              Protocol: tcp
              AppProtocol: http
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: POLICYFLOW_EMF_ENABLED
              Value: "true"
            - Name: POLICYFLOW_MODEL_BACKEND
              Value: !If [BedrockEnabled, bedrock, deterministic]
            - !If
              - BedrockEnabled
              - Name: POLICYFLOW_BEDROCK_MODEL_ID
                Value: !Ref BedrockInferenceProfileId
              - !Ref AWS::NoValue
          Secrets:
            - Name: POLICYFLOW_AUTH_TOKEN
              ValueFrom: !Sub "${RuntimeSecret}:auth_token::"
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c "import urllib.request;
                urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
                || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
              mode: non-blocking
              max-buffer-size: 4m
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health/ready
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: application/json
            MessageBody: '{"detail":"origin authentication required"}'

  OriginHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-PolicyFlow-Origin
            Values: [!Ref OriginVerifySecret]
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: OriginHeaderRule
    Properties:
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: policyflow-api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-disabled"
        Comment: API traffic is never cached.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-api"
        Comment: Forward API inputs while CloudFront supplies the ALB origin header.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - X-PolicyFlow-Authorization
            - X-Correlation-ID
            - X-Subject
            - X-Role
            - X-Tenant-ID
            - X-Classification
        QueryStringsConfig:
          QueryStringBehavior: all

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectName}-${EnvironmentName}-security"
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  AuthorizationHeaderFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-authorization"
      AutoPublish: true
      FunctionConfig:
        Comment: Safely map the viewer bearer token to an origin-forwarded header.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var viewerAuthorization = request.headers.authorization;
          delete request.headers['x-policyflow-authorization'];
          if (viewerAuthorization) {
            request.headers['x-policyflow-authorization'] = {
              value: viewerAuthorization.value
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${EnvironmentName} HTTPS edge"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: policyflow-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-PolicyFlow-Origin
                HeaderValue: !Ref OriginVerifySecret
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: policyflow-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref CachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AuthorizationHeaderFunction.FunctionARN
          Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApplicationErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterName: !Sub "${ProjectName}-${EnvironmentName}-errors"
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: PolicyFlow
          MetricName: ApplicationErrors
          MetricValue: "1"
          DefaultValue: 0

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow ECS service CPU is high for ten minutes.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !Sub "${ProjectName}-${EnvironmentName}"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TargetFiveXxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow targets returned five or more 5xx responses in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PolicyFlow has an unhealthy registered target.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${EnvironmentName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "ECS CPU and memory",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", "ClusterName", "${Cluster}", "ServiceName", "${ProjectName}-${EnvironmentName}"],
                  [".", "MemoryUtilization", ".", ".", ".", "."]
                ],
                "period": 300,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "ALB requests, latency, and errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", {"stat": "Sum"}],
                  [".", "TargetResponseTime", ".", ".", {"stat": "p95"}],
                  [".", "HTTPCode_Target_5XX_Count", ".", ".", {"stat": "Sum"}]
                ],
                "period": 300
              }
            },
            {
              "type": "log",
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Recent application requests",
                "region": "${AWS::Region}",
                "query": "SOURCE '${LogGroup}' | fields @timestamp, level, method, route, status_code, duration_ms, correlation_id | sort @timestamp desc | limit 50"
              }
            }
          ]
        }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Exact-repository OIDC role for PolicyFlow image and ECS deployments.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubProvider
                - !Ref GitHubOidcProvider
                - !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: DeployOnlyPolicyFlow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyPolicyFlowImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Ref EcrRepositoryArn
              - Sid: RegisterAndReadTaskDefinition
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: DeployOnlyPolicyFlowService
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-${EnvironmentName}/${ProjectName}-${EnvironmentName}"
              - Sid: PassOnlyPolicyFlowTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  HttpsUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  CloudFrontDistributionId:
    Value: !Ref Distribution
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !Sub "${ProjectName}-${EnvironmentName}"
  TaskDefinitionFamily:
    Value: !Sub "${ProjectName}-${EnvironmentName}"
  RuntimeSecretArn:
    Value: !Ref RuntimeSecret
  LogGroupName:
    Value: !Ref LogGroup
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ProjectName}-${EnvironmentName}"
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  EcrRepositoryName:
    Value: !Ref EcrRepositoryName
