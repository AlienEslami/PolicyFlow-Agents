name: Deploy AWS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: policyflow-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: policyflow-agents-prod
  ECS_CLUSTER: policyflow-agents-prod
  ECS_SERVICE: policyflow-agents-prod
  ECS_TASK_FAMILY: policyflow-agents-prod
  ECS_CONTAINER: policyflow-api

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: cfn-lint infra/aws/*.yaml
      - run: pytest --cov=policyflow --cov-branch
      - run: policyflow evaluate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: aws-production
      url: ${{ vars.POLICYFLOW_HTTPS_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Require ECR scan without critical findings
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG"
          critical="$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)"
          if [ "$critical" != "None" ] && [ "$critical" -gt 0 ]; then
            echo "ECR scan found $critical critical vulnerabilities"
            exit 1
          fi

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with immutable image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy and wait for service stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify HTTPS deployment under load
        run: |
          python scripts/load_test.py \
            --url "${{ vars.POLICYFLOW_HTTPS_URL }}/health/live" \
            --requests 60 \
            --concurrency 6 \
            --max-error-rate 0 \
            --max-p95-ms 2500 \
            --output load-test.json

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policyflow-aws-${{ github.sha }}
          path: load-test.json
          if-no-files-found: warn
