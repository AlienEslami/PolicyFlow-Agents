name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: cfn-lint infra/aws/*.yaml
      - run: pytest -p no:cacheprovider --cov=policyflow --cov-branch --cov-report=xml
      - run: policyflow evaluate
      - run: docker compose config
      - run: docker build -t policyflow-agents:ci .
