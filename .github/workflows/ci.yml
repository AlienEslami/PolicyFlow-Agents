name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: cfn-lint infra/aws/*.yaml
      - run: pytest -p no:cacheprovider --cov=policyflow --cov-branch --cov-report=xml
      - run: policyflow evaluate
      - run: docker compose config
      - run: docker build -t policyflow-agents:ci .
